function screenBalanco(){
  const ids=lojas(),corte=D.meta.corte,mc=DFC_LAST;
  const h=head('Posição patrimonial parcial','Itens de ativo, passivo e patrimônio que o banco sustenta na data de corte (' + corte.split('-').reverse().join('/') + '). Não é balanço: o que não existe aparece como indisponível. Não use para concluir sobre patrimônio líquido.');
  const NA='<span class="chip na">Indisponível</span>',EST='<span class="chip est">Provisório</span>';
  /* caixa e bancos: saldo de abertura do sistema + fluxos até o último mês do DFC */
  const cx=ACC.filter(a=>a.tipo!=='CARTAO_CREDITO'&&ids.includes(a.idloja));
  let somaCx=0,nCx=0,nInc=0;
  const cxRows=cx.map(a=>{
    const an=ANCH[a.key];let v=null,inc=false;
    if(an){v=an.v;DFC_MONTHS.forEach(m=>{if(m>=an.open)v+=netKey(a.key,m)});if(v<0){inc=true;nInc++}else{somaCx+=v;nCx++}}
    const val=v==null?'indisponível':inc?'inconsistente':brl(v);
    const why=!an?'Sem saldo de abertura no sistema e sem extrato.':inc?`Saldo de abertura de ${an.data.split('-').reverse().join('/')} + fluxos do livro-caixa até ${mlabel(mc)} resulta em ${brl(v)}. Saldo negativo é incompatível com o caixa real: o livro-caixa está incompleto (entradas lançadas em lotes) e o valor não é usado.`:`Saldo de abertura do sistema em ${an.data.split('-').reverse().join('/')} + fluxos do livro-caixa até ${mlabel(mc)} (mês parcial).`;
    return `<tr><td>${esc(LNOME[a.idloja].split(' ')[0])} · ${esc(a.banco)}</td><td class="num">${val}</td><td class="note" style="text-align:left;white-space:normal;font-weight:400">${why}</td></tr>`;
  }).join('');
  /* receber / pagar a partir do aging */
  const ag={};D.aging.filter(r=>ids.includes(String(r.idloja))).forEach(r=>{const k=r.tipo+'|'+r.faixa;(ag[k]=ag[k]||{n:0,v:0});ag[k].n+=r.n;ag[k].v+=r.v});
  const faixas=[...new Set(D.aging.map(r=>r.faixa))].sort();
  const tot=t=>faixas.reduce((s,f)=>({n:s.n+(ag[t+'|'+f]?ag[t+'|'+f].n:0),v:s.v+(ag[t+'|'+f]?ag[t+'|'+f].v:0)}),{n:0,v:0});
  const rec=tot('CREDITO'),pag=tot('DEBITO');
  const agRows=t=>faixas.filter(f=>ag[t+'|'+f]).map(f=>`<tr class="sub det"><td>${esc(f.replace(/^\d /,''))}</td><td class="num">${brl(ag[t+'|'+f].v)}</td><td class="note" style="text-align:left;font-weight:400">${ag[t+'|'+f].n} título(s)</td></tr>`).join('');
  /* movimentos de financiamento e sócios observados no DFC (não são saldos) */
  let emp=0,jur=0,apo=0,ret=0;
  ids.forEach(id=>DFC_MONTHS.forEach(m=>{
    ACC.filter(a=>a.idloja===id).forEach(a=>(dfcIdx[a.key+'|'+m]||[]).forEach(r=>{
      if(r.linha==='Emprestimos recebidos')emp+=r.liquido;
      else if(r.linha==='Juros, tarifas e amortizacao')jur+=r.liquido;
      else if(r.linha==='Aportes de socios')apo+=r.liquido;
      else if(r.linha==='Retiradas e distribuicao de lucros')ret+=r.liquido;
    }));
  }));
  const rowNA=(n,why)=>`<tr><td>${n}</td><td class="num">indisponível</td><td class="note" style="text-align:left;white-space:normal;font-weight:400">${why}</td></tr>`;
  const T=(id,title,rows,note)=>`<div class="card" style="margin-top:12px"><h3>${title}</h3><div class="tw"><table id="${id}"><tr><th class="l">Item</th><th>R$</th><th class="l">Base e limitação</th></tr>${rows}</table></div>${note?`<p class="note" style="margin-top:6px">${note}</p>`:''}<div class="row">${copyBtn(id)}</div></div>`;
  const ativo=`<tr class="tot"><td><b>Caixa e bancos (parcial)</b> ${EST}</td><td class="num"><b>${nCx?brl(somaCx):'indisponível'}</b></td><td class="note" style="text-align:left;white-space:normal;font-weight:400">${nCx?'Soma de '+nCx+' de '+cx.length+' contas com saldo calculável. Não é saldo bancário conciliado.':'Nenhuma conta tem saldo confiável: '+(cx.length-nCx-nInc)+' sem saldo de abertura e '+nInc+' com saldo calculado negativo (fluxos incompletos). Depende de extrato/OFX.'}</td></tr>${cxRows}
  <tr class="tot"><td><b>Contas a receber de vendas, bruto lançado</b> ${EST}</td><td class="num"><b>${brl(rec.v)}</b></td><td class="note" style="text-align:left;white-space:normal;font-weight:400">${rec.n} título(s) de cartão/vale não baixados e vencidos. A confirmar com os extratos: pode ser recebimento sem baixa. Não é inadimplência comprovada nem valor recuperável.</td></tr>${agRows('CREDITO')}
  ${rowNA('Estoque','Inventário e ficha técnica vazios no sistema (gw_estoque_inventario = 0 linhas).')}${rowNA('Imobilizado e investimentos','Não existe cadastro de ativos no banco; “investimentos a revisar” no DFC são só saídas.')}${rowNA('Outros ativos (adiantamentos, tributos a recuperar)','Não identificados.')}`;
  const passivo=`<tr class="tot"><td><b>Contas a pagar, títulos em aberto</b> ${EST}</td><td class="num"><b>${brl(pag.v)}</b></td><td class="note" style="text-align:left;white-space:normal;font-weight:400">${pag.n} título(s). Podem incluir baixas não registradas e parcelas já pagas fora do sistema.</td></tr>${agRows('DEBITO')}
  <tr><td>Empréstimo recebido em ${mlabel('2026-04')} (principal)</td><td class="num">${brl(emp)}</td><td class="note" style="text-align:left;white-space:normal;font-weight:400">Entrada de caixa lançada no livro-caixa. Saldo devedor: não calculável, pois juros e amortização estão na mesma linha (${brl(jur)} pagos no período do DFC).</td></tr>
  ${rowNA('Saldo devedor de financiamentos','Contrato e tabela de amortização não estão no banco.')}${rowNA('Faturas de cartão de crédito','Contas de cartão têm fluxo, mas sem saldo de abertura.')}${rowNA('Obrigações trabalhistas e tributos a pagar (férias, 13º, DAS)','Sem provisões nem apuração no banco; folha detalhada é dependência externa.')}`;
  const pl=`<tr><td>Aportes de sócios no período do DFC</td><td class="num">${brl(apo)}</td><td class="note" style="text-align:left;white-space:normal;font-weight:400">Movimento observado, não é saldo de capital.</td></tr>
  <tr><td>Retiradas e distribuição de lucros no período do DFC</td><td class="num">${brl(ret)}</td><td class="note" style="text-align:left;white-space:normal;font-weight:400">Movimento observado. Não é despesa da DRE.</td></tr>
  ${rowNA('Capital social','Não está no banco.')}${rowNA('Lucros ou prejuízos acumulados','Não há DRE por competência nem balanço de abertura.')}${rowNA('Patrimônio líquido','Não é calculável como residual: faltam estoque, imobilizado, dívidas e saldos de contas.')}`;
  const ident=somaCx+rec.v,pass=pag.v;
  return h
  +`<p class="note">Posição na data de corte; os filtros de período e “Avaliar por” não se aplicam. A loja selecionada vale. Saldos de caixa só quando há saldo de abertura no sistema e o resultado não é negativo (simulações da tela DFC não são usadas).</p>`
  +`<div class="grid">
    <div class="card kpi"><h3>Ativo identificado (parcial)</h3><div class="v">${brlk(ident)}</div><div class="s">${nCx?'Caixa parcial + recebíveis brutos':'Só recebíveis brutos (caixa indisponível)'} ${EST}</div></div>
    <div class="card kpi"><h3>Passivo identificado (parcial)</h3><div class="v">${brlk(pass)}</div><div class="s">Contas a pagar em aberto ${EST}</div></div>
    <div class="card kpi"><h3>Ativo = Passivo + PL?</h3><div class="v">Não verificável</div><div class="s">Faltam estoque, imobilizado, dívidas, capital e saldos confiáveis de ${cx.length-nCx} conta(s) ${NA}</div></div>
  </div>`
  +T('tBalAtivo','Ativo',ativo,'')
  +T('tBalPassivo','Passivo',passivo,'')
  +T('tBalPL','Patrimônio líquido',pl,'')
  +`<div class="banner" style="margin-top:10px"><b>Limites.</b> A diferença entre ativo e passivo identificados <b>não</b> é patrimônio líquido. Recebíveis vencidos estão a conciliar com extratos (Fase 17) e podem reduzir o ativo se já foram recebidos sem baixa. Nenhuma linha está validada.</div>`;
}

const SCREENS={ponte:screenPonte,balanco:screenBalanco,respostas:screenRespostas,inteligencia:screenInteligencia,homolog:screenHomolog,painel:screenPainel,vendas:screenVendas,perdas:screenPerdas,custos:screenCustos,dre:screenDRE,dfc:screenDFC,caixa:screenCaixa,qualidade:screenQualidade,plano:screenPlano,modelo:screenModelo};
for(const k of Object.keys(SCREENS))SCREENS[k]=withBaseNote(k,SCREENS[k]);

/* ---------- montagem ---------- */
function render(){
  document.documentElement.classList.toggle('apres',S.apres);
  const nav=document.getElementById('nav');
  const TN=Object.fromEntries(TABS);
  const GR=[['Visão geral',['painel']],['Resultado',['dre','custos','ponte']],['Caixa e posição',['dfc','caixa','balanco']],['Operação',['vendas','perdas','inteligencia']],['Decisão',['respostas','plano']],['Governança',['qualidade','modelo','homolog']]];
  nav.innerHTML=GR.map(([g,ks])=>`<div class="navg">${g}</div>`+ks.map(k=>`<button type="button" data-tab="${k}" ${k===S.tab?'aria-current="page"':''}>${TN[k]}</button>`).join('')).join('');
  if(!SCREENS[S.tab])S.tab=S.tab==='dreanal'?'dre':'painel';
  document.getElementById('main').innerHTML=`<section class="screen"><div class="banner"><b>Demonstração.</b> Dados anonimizados e em escala; todos os indicadores são provisórios e nenhum está validado. CMV real, lucro contábil, inadimplência e perdas de caixa não são apresentados como conclusão.</div>${SCREENS[S.tab]()}</section>`;
  document.getElementById('fLoja').innerHTML=['all',...IDS].map(k=>`<button type="button" data-loja="${k}" aria-pressed="${S.loja===k}">${k==='all'?'Consolidado':LNOME[k].split(' ')[0]}</button>`).join('');
  document.getElementById('fBase').innerHTML=[['venc','Vencimento'],['caixa','Caixa'],['emissao','Emissão*']].map(([k,n])=>`<button type="button" data-base="${k}" aria-pressed="${S.base===k}" ${k==='emissao'?'title="Emissão não é competência validada"':''}>${n}</button>`).join('');
  document.getElementById('srcTag').textContent='CONECTADO AO VIVO · SUPABASE RLS + GARÇOM WEB · corte '+D.meta.corte.split('-').reverse().join('/');
  save();
}
function fillSelects(){
  const opt=m=>`<option value="${m}">${mlabel(m)}${m===D.meta.corte.slice(0,7)?' (parcial)':''}</option>`;
  const de=document.getElementById('fDe'),ate=document.getElementById('fAte'),pre=document.getElementById('fPre');
  de.innerHTML=MONTHS.map(opt).join('');ate.innerHTML=MONTHS.map(opt).join('');de.value=S.from;ate.value=S.to;
  const P=[['jt','Janela confiável (fev–jul/26)','2026-02','2026-07'],['a26','2026 até set','2026-01','2026-09'],['u12','Últimos 12 meses (até set/26)','2025-10','2026-09'],['a25','2025 completo','2025-01','2025-12'],['ult','Tudo desde 2023',MONTHS[0],MONTHS[MONTHS.length-1]]];
  pre.innerHTML='<option value="">Escolher…</option>'+P.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('');
  pre.onchange=()=>{const p=P.find(x=>x[0]===pre.value);if(p){S.from=p[2];S.to=p[3];de.value=S.from;ate.value=S.to;render()}};
  de.onchange=()=>{S.from=de.value;if(S.from>S.to){S.to=S.from;ate.value=S.to}render()};
  ate.onchange=()=>{S.to=ate.value;if(S.to<S.from){S.from=S.to;de.value=S.from}render()};
}
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('[data-tab],[data-loja],[data-base]');if(!t)return;
  if(t.dataset.tab)S.tab=t.dataset.tab;if(t.dataset.loja)S.loja=t.dataset.loja;if(t.dataset.base)S.base=t.dataset.base;
  render();
});
document.addEventListener('input',e=>{
  const r=e.target.closest&&e.target.closest('input.resp');if(!r)return;
  let rs={};try{rs=JSON.parse(localStorage.getItem('mesa_plano_resp')||'{}')}catch(x){}
  rs[r.dataset.i]=r.value;try{localStorage.setItem('mesa_plano_resp',JSON.stringify(rs))}catch(x){}
});
document.addEventListener('change',e=>{
  const s=e.target.closest&&e.target.closest('select.st');if(!s)return;
  let st={};try{st=JSON.parse(localStorage.getItem('mesa_plano')||'{}')}catch(x){}
  st[s.dataset.i]=s.value;try{localStorage.setItem('mesa_plano',JSON.stringify(st))}catch(x){}
});
document.getElementById('bApres').onclick=()=>{S.apres=!S.apres;document.getElementById('bApres').textContent=S.apres?'Sair da apresentação':'Modo apresentação';render()};
document.getElementById('bTema').onclick=()=>{const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark')};

function dfcFirst(){return buildCols(selAccts()).first}
function rerender(){const y=window.scrollY;saveDre();saveDfc();render();window.scrollTo(0,y)}
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('[data-exp],[data-acc],[data-accset],[data-dfcmode],[data-setrange],[data-si0],[data-siclear],[data-scclear]');if(!t)return;
  const d=t.dataset;
  if(d.exp)S.exp[d.exp]=!S.exp[d.exp];
  else if(d.acc){const x=selSet();x.has(d.acc)?x.delete(d.acc):x.add(d.acc);S.accSel=[...x]}
  else if(d.accset)S.accSel=d.accset==='bank'?ACC.filter(a=>a.tipo==='CONTA').map(a=>a.key):d.accset==='all'?ACC.map(a=>a.key):null;
  else if(d.dfcmode)S.dfcMode=d.dfcmode;
  else if(d.setrange){const p=d.setrange.split('|');S.from=p[0];S.to=p[1];fillSelects()}
  else if(d.si0){const f=dfcFirst();selAccts().forEach(a=>{if(openBal(a.key,f).v==null)S.si[a.key]={m:f,v:0}})}
  else if(d.siclear)S.si={};
  else if(d.scclear)S.sc=JSON.parse(JSON.stringify(SC0));
  rerender();
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset)return;const d=t.dataset;
  if(d.opt){const k=d.opt;S[k]=t.type==='checkbox'?t.checked:(t.type==='number'?+t.value:t.value);rerender()}
  else if(d.limr!==undefined){if(t.value==='')delete S.limr[d.limr];else S.limr[d.limr]=+t.value;rerender()}
  else if(d.si!==undefined){const f=dfcFirst();if(t.value==='')delete S.si[d.si];else S.si[d.si]={m:f,v:+t.value};rerender()}
  else if(d.sc!==undefined){S.sc[d.sc]=+t.value||0;rerender()}
  else if(d.over!==undefined){if(t.value==='')delete S.sc.over[d.over];else S.sc.over[d.over]=+t.value;rerender()}
});

window.__refreshMesaRealtime = function() {
  for (const k in vIdx) delete vIdx[k];
  for (const k in cIdx) delete cIdx[k];
  for (const k in covIdx) delete covIdx[k];
  for (const k in taxIdx) delete taxIdx[k];
  for (const k in dIdx) delete dIdx[k];
  for (const k in rIdx) delete rIdx[k];
  for (const k in dcIdx) delete dcIdx[k];
  D.vendas.forEach(r=>vIdx[r.idloja+'|'+r.mes]=r);
  D.concil.forEach(r=>cIdx[r.idloja+'|'+r.mes]=r);
  D.cobertura.forEach(r=>covIdx[r.idloja+'|'+r.mes]=r);
  D.taxas.forEach(r=>{const k=r.idloja+'|'+r.mes;(taxIdx[k]=taxIdx[k]||{taxas:0,bruto:0});taxIdx[k].taxas+=r.taxas;taxIdx[k].bruto+=r.bruto});
  D.desp.forEach(r=>{const k=r.idloja+'|'+r.base+'|'+r.mes;(dIdx[k]=dIdx[k]||[]).push(r)});
  D.receb.forEach(r=>{const k=r.idloja+'|'+r.mes;(rIdx[k]=rIdx[k]||{})[r.tipo]=(rIdx[k][r.tipo]||0)+r.valor});
  D.desc_classe.forEach(r=>{const k=r.idloja+'|'+r.mes;(dcIdx[k]=dcIdx[k]||{})[r.classe]=r.desconto});
  rerender();
};
fillSelects();render();
};

</script>
