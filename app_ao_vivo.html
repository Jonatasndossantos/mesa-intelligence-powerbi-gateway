<style id="mesa-live-auth-styles">
  #mesaAuthOverlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: radial-gradient(circle at 50% 20%, #172554 0%, #090d16 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f8fafc;
  }
  #mesaAuthOverlay.hidden {
    display: none !important;
  }
  .mesa-auth-card {
    width: 100%;
    max-width: 430px;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(12px);
  }
  .mesa-auth-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  .mesa-auth-card h1 {
    margin: 0 0 6px 0;
    font-size: 22px;
    font-weight: 700;
    color: #f8fafc;
  }
  .mesa-auth-card p.sub {
    margin: 0 0 22px 0;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.5;
  }
  .mesa-field {
    margin-bottom: 14px;
  }
  .mesa-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 6px;
  }
  .mesa-field input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #090d16;
    color: #f8fafc;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .mesa-field input:focus {
    border-color: #38bdf8;
  }
  .mesa-btn-primary {
    width: 100%;
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #2563eb, #0284c7);
    color: #ffffff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .mesa-btn-primary:hover {
    opacity: 0.95;
  }
  .mesa-btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .mesa-auth-msg {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.4;
    display: none;
  }
  .mesa-auth-msg.err {
    display: block;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #fca5a5;
  }
  .mesa-auth-msg.ok {
    display: block;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.35);
    color: #6ee7b7;
  }
  .mesa-cfg-toggle {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #64748b;
  }
  .mesa-cfg-toggle button {
    background: none;
    border: none;
    color: #38bdf8;
    cursor: pointer;
    font-size: 12px;
    padding: 0;
    text-decoration: underline;
  }
  #mesaCfgBox {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: rgba(2, 6, 23, 0.65);
    border: 1px solid #1e293b;
    border-radius: 8px;
  }
  #mesaCfgBox.open {
    display: block;
  }
  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.14);
    border: 1px solid rgba(16, 185, 129, 0.35);
    color: #10b981;
    font-size: 11px;
    font-weight: 700;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
    animation: mesaPulse 1.8s infinite;
  }
  @keyframes mesaPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.55; }
  }
  #mesaRealtimeToast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 99990;
    background: #0f172a;
    border: 1px solid #10b981;
    color: #f8fafc;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 12.5px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    gap: 10px;
  }
</style>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<style>
/* Layout: filtros fixos no topo, navegação lateral (vira abas roláveis no celular), telas por tema de decisão.
   Paleta MESA: azul-marinho, azul e laranja; uma cor por loja em todas as telas (ALFA laranja, BETA azul). */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface2:#E8EEF5; --line:#D3DCE7; --fg:#101B2B; --muted:#51647B;
  --blue:#0B6FB0; --orange:#C9690F; --good:#12805A; --warn:#946A00; --crit:#C23A3A;
  --c1:#0B6FB0; --c2:#C9690F; --c3:#0E8A74; --c4:#6D4FC4; --c5:#B83C78; --c6:#8A7A12;
  --shadow:0 1px 2px rgba(16,27,43,.08);
  --f-display:'Sora','IBM Plex Sans',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-num:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101B2B; --surface:#1D3047; --surface2:#26405E; --line:#33506F; --fg:#FFFFFF; --muted:#AABCD0;
  --blue:#52C4FF; --orange:#F59E42; --good:#4CC38A; --warn:#F2C14E; --crit:#FF7A7A;
  --c1:#3A9BD9; --c2:#E08A2C; --c3:#2FB89A; --c4:#8B7BE0; --c5:#C75AA0; --c6:#A8A04A; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101B2B; --surface:#1D3047; --surface2:#26405E; --line:#33506F; --fg:#FFFFFF; --muted:#AABCD0;
  --blue:#52C4FF; --orange:#F59E42; --good:#4CC38A; --warn:#F2C14E; --crit:#FF7A7A;
  --c1:#3A9BD9; --c2:#E08A2C; --c3:#2FB89A; --c4:#8B7BE0; --c5:#C75AA0; --c6:#A8A04A; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0;min-width:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.logobox{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 9px;align-self:center}
.logo{height:30px;width:auto;display:block}
.apres .logo{height:38px}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:.02em}
.brand small{color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px;min-width:0}
.fg>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#06121F;font-weight:600}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding-block:18px}
nav.side{position:sticky;top:130px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav.side button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
nav.side .navg{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg);background:var(--surface2);border-left:4px solid var(--blue);border-radius:6px;padding:7px 10px;margin-top:14px;margin-bottom:3px;font-weight:700;cursor:default;user-select:none;pointer-events:none}
nav.side .navg:first-child{margin-top:0}
nav.side button{padding-left:22px}
nav.side button[aria-current="page"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--orange)}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.apres .shell{grid-template-columns:minmax(0,1fr)}.apres nav.side{display:none}.apres body{font-size:16px}
section.screen[hidden]{display:none}
.h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.h h2{font-size:22px}.h p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.banner{border:1px solid var(--warn);border-radius:10px;padding:9px 12px;color:var(--fg);background:var(--surface)}
.banner b{color:var(--warn)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}
.kpi .v{font-family:var(--f-num);font-size:26px;font-weight:500;letter-spacing:-.01em}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:1px 8px;border:1px solid currentColor;margin-left:6px;vertical-align:middle}
.chip.ok{color:var(--good)}.chip.est{color:var(--warn)}.chip.pen{color:var(--crit)}.chip.na{color:var(--muted)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr.tot td{font-weight:600;background:var(--surface2)}tr.tot td:first-child{background:var(--surface2)}
tr.sub td:first-child{padding-left:24px;color:var(--muted)}
td.l,th.l{text-align:left}
.neg{color:var(--crit)}
.bar{height:8px;border-radius:4px;background:var(--blue);min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;max-width:100%}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.axis{stroke:var(--line)}.gridl{stroke:var(--line);stroke-dasharray:2 4;opacity:.7}
[data-tip]{cursor:default}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;max-width:260px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.note{color:var(--muted);font-size:12px;max-width:80ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:3px}
.hbar .t{background:var(--surface2);border-radius:4px;height:10px;position:relative}
.hbar .t div{height:10px;border-radius:4px}
.xp{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 6px 0 0}
.ah.good,.good{color:var(--good)}.ah.crit,.crit{color:var(--crit)}.ah.na,.ah.ind{color:var(--muted)}
.alert{color:var(--crit)}td.av{color:var(--muted)}
tr.hdr td{background:var(--surface2);font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600}
th.proj,td.proj{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,127,127,.12) 6px 12px);font-style:italic}
th.sim,td.sim{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(245,158,66,.2) 6px 12px);font-style:italic}
th.part,td.part{opacity:.8}
.acc[aria-pressed="true"]{background:var(--blue);color:#06121F;border-color:var(--blue)}
tr.det td{font-size:12px}
input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 7px;color:inherit;font:inherit}
th small{font-weight:400;text-transform:none;letter-spacing:0}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .top{position:static}
  nav.side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.side button{white-space:nowrap;box-shadow:none!important;border:1px solid var(--line)}
  nav.side .navg{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
window.DATA = null;
window.MESA_DEFAULT_SUPABASE = {
  url: "",
  anonKey: ""
};

(function() {
  'use strict';
  const ALL_LIST_KEYS = [
    'vendas','receb','concil','desp','taxas','cobertura','desc_classe',
    'grupos','produtos','horas','aging','dup_top','indic','contas','saldos',
    'dfc','compromissos','aud','dre_lanc','dre_conc','dre_semdata','vprod',
    'excl','excl_gerente','atend','custocob','excl_top','sobrep','fech',
    'fech_meio','fech_cmp','caixa_ev','troco_extra','repique_ev','lacunas'
  ];

  let supaClient = null;
  let realtimeChannel = null;
  let engineBooted = false;

  function getSupaCredentials() {
    const url = localStorage.getItem('mesa_supa_url') || window.MESA_DEFAULT_SUPABASE.url || '';
    const anonKey = localStorage.getItem('mesa_supa_anon') || window.MESA_DEFAULT_SUPABASE.anonKey || '';
    return { url: url.trim(), anonKey: anonKey.trim() };
  }

  function showMsg(text, type) {
    const el = document.getElementById('mesaAuthMsg');
    if (!el) return;
    el.textContent = text;
    el.className = 'mesa-auth-msg ' + (type || 'err');
  }

  function showToast(text) {
    const t = document.getElementById('mesaRealtimeToast');
    const txt = document.getElementById('mesaRealtimeToastTxt');
    if (!t || !txt) return;
    txt.textContent = text;
    t.style.display = 'inline-flex';
    clearTimeout(window.__mesaToastTimer);
    window.__mesaToastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  function initSupabaseClient() {
    const creds = getSupaCredentials();
    const urlInput = document.getElementById('mesaSupaUrl');
    const anonInput = document.getElementById('mesaSupaAnon');
    const statusLbl = document.getElementById('mesaConnStatusLbl');

    if (urlInput) urlInput.value = creds.url;
    if (anonInput) anonInput.value = creds.anonKey;

    if (!creds.url || !creds.anonKey) {
      if (statusLbl) statusLbl.textContent = '⚠️ Configure URL e Key do Supabase';
      const box = document.getElementById('mesaCfgBox');
      if (box) box.classList.add('open');
      return null;
    }
    if (statusLbl) statusLbl.textContent = '🔗 ' + creds.url.replace('https://', '');
    try {
      supaClient = window.supabase.createClient(creds.url, creds.anonKey);
      return supaClient;
    } catch (err) {
      showMsg('Erro ao inicializar cliente Supabase: ' + err.message, 'err');
      return null;
    }
  }

  async function fetchAndHydrateDashboard(user) {
    const btn = document.getElementById('mesaLoginBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Carregando dados criptografados (RLS)...'; }

    try {
      const [lojasRes, vendasRes, modulosRes] = await Promise.all([
        supaClient.from('lojas').select('*').eq('ativo', true).order('idloja'),
        supaClient.from('vendas_mensais').select('*').order('mes'),
        supaClient.from('loja_modulos').select('idloja, modulo, dados')
      ]);

      if (lojasRes.error) throw lojasRes.error;
      if (vendasRes.error) throw vendasRes.error;
      if (modulosRes.error) throw modulosRes.error;

      const lojasRows = lojasRes.data || [];
      if (lojasRows.length === 0) {
        throw new Error(
          'Seu usuário (' + user.email + ') está autenticado, mas ainda não possui lojas vinculadas em public.user_lojas (ou o banco está vazio). Rode o comando SELECT public.vincular_usuario_por_email() no SQL Editor do Supabase.'
        );
      }

      const lojasMap = {};
      const ordem = [];
      let corte = new Date().toISOString().slice(0, 10);

      lojasRows.forEach(r => {
        const lid = String(r.idloja);
        lojasMap[lid] = r.nome;
        ordem.push(lid);
        if (r.corte) corte = String(r.corte).slice(0, 10);
      });

      const vendas = (vendasRes.data || []).map(r => ({
        idloja: Number(r.idloja),
        mes: String(r.mes),
        pedidos_validos: Number(r.pedidos_validos || 0),
        lancado: Number(r.lancado || 0),
        excluidos: Number(r.excluidos || 0),
        venda_bruta: Number(r.venda_bruta || 0),
        descontos: Number(r.descontos || 0),
        venda_liquida: Number(r.venda_liquida || 0),
        servico: Number(r.servico || 0),
        total_com_servico: Number(r.total_com_servico || 0)
      }));

      const months = [...new Set(vendas.map(v => v.mes))].sort();
      const latestMonth = months.length ? months[months.length - 1] : '2026-08';

      const assembled = {
        meta: {
          corte: corte,
          gerado: new Date().toISOString().slice(0, 10),
          lojas: lojasMap,
          ordem: ordem,
          mes_detalhe: latestMonth,
          base: 'GARÇOM WEB AO VIVO · SUPABASE RLS',
          provisorio: false,
          versao: '4.0.0-realtime',
          demo: false
        }
      };

      ALL_LIST_KEYS.forEach(k => { assembled[k] = []; });
      assembled.vendas = vendas;

      (modulosRes.data || []).forEach(row => {
        const mod = row.modulo;
        const arr = Array.isArray(row.dados) ? row.dados : [];
        if (!assembled[mod]) assembled[mod] = [];
        if (mod === 'aud' || mod === 'lacunas') {
          if (assembled[mod].length === 0) assembled[mod] = arr;
        } else {
          assembled[mod].push(...arr);
        }
      });

      window.DATA = assembled;

      // Oculta tela de login e exibe controles de sessão
      document.getElementById('mesaAuthOverlay').classList.add('hidden');
      const liveBadge = document.getElementById('mesaLiveBadge');
      const liveTxt = document.getElementById('mesaLiveTxt');
      const logoutBtn = document.getElementById('bLogout');
      if (liveBadge) liveBadge.style.display = 'inline-flex';
      if (liveTxt) liveTxt.textContent = 'AO VIVO · ' + user.email;
      if (logoutBtn) logoutBtn.style.display = 'inline-block';

      if (!engineBooted) {
        engineBooted = true;
        window.__bootMesaEngine();
      } else if (window.__refreshMesaRealtime) {
        window.__refreshMesaRealtime();
      }

      subscribeRealtime();
    } catch (err) {
      showMsg(err.message || 'Falha ao carregar dados do Supabase.', 'err');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Entrar e Conectar Ao Vivo →'; }
    }
  }

  function subscribeRealtime() {
    if (!supaClient || realtimeChannel) return;
    realtimeChannel = supaClient
      .channel('mesa-intelligence-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'vendas_mensais' }, payload => {
        if (!window.DATA) return;
        const row = payload.new;
        if (!row || !row.idloja) return;
        const up = {
          idloja: Number(row.idloja),
          mes: String(row.mes),
          pedidos_validos: Number(row.pedidos_validos || 0),
          lancado: Number(row.lancado || 0),
          excluidos: Number(row.excluidos || 0),
          venda_bruta: Number(row.venda_bruta || 0),
          descontos: Number(row.descontos || 0),
          venda_liquida: Number(row.venda_liquida || 0),
          servico: Number(row.servico || 0),
          total_com_servico: Number(row.total_com_servico || 0)
        };
        const idx = window.DATA.vendas.findIndex(v => Number(v.idloja) === up.idloja && v.mes === up.mes);
        if (idx >= 0) window.DATA.vendas[idx] = up;
        else window.DATA.vendas.push(up);

        if (window.__refreshMesaRealtime) window.__refreshMesaRealtime();
        const nomeLoja = (window.DATA.meta.lojas && window.DATA.meta.lojas[String(up.idloja)]) || ('Loja ' + up.idloja);
        showToast('⚡ Vendas atualizadas ao vivo: ' + nomeLoja + ' (' + up.mes + ')');
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'loja_modulos' }, payload => {
        if (!window.DATA) return;
        const row = payload.new;
        if (!row || !row.modulo) return;
        const mod = row.modulo;
        const lid = Number(row.idloja);
        const novos = Array.isArray(row.dados) ? row.dados : [];
        if (mod === 'aud' || mod === 'lacunas') {
          window.DATA[mod] = novos;
        } else if (Array.isArray(window.DATA[mod])) {
          window.DATA[mod] = window.DATA[mod].filter(item => Number(item.idloja) !== lid).concat(novos);
        }
        if (window.__refreshMesaRealtime) window.__refreshMesaRealtime();
        showToast('⚡ Módulo "' + mod + '" sincronizado ao vivo!');
      })
      .subscribe();
  }

  window.addEventListener('DOMContentLoaded', async () => {
    // Injeta overlay de autenticação no body
    document.body.insertAdjacentHTML('afterbegin', "\n<div id=\"mesaAuthOverlay\">\n  <div class=\"mesa-auth-card\">\n    <div class=\"mesa-auth-badge\">\n      <span class=\"live-dot\"></span> CONECTIVIDADE AO VIVO \u00b7 SUPABASE + GAR\u00c7OM WEB\n    </div>\n    <h1>\ud83c\udf7d\ufe0f MESA Intelligence</h1>\n    <p class=\"sub\">Acesse com suas credenciais para carregar os dados em tempo real das lojas autorizadas para o seu perfil.</p>\n\n    <form id=\"mesaLoginForm\">\n      <div class=\"mesa-field\">\n        <label for=\"mesaEmail\">E-mail corporativo</label>\n        <input type=\"email\" id=\"mesaEmail\" placeholder=\"seuemail@restaurante.com.br\" required autocomplete=\"username\" />\n      </div>\n      <div class=\"mesa-field\">\n        <label for=\"mesaPassword\">Senha</label>\n        <input type=\"password\" id=\"mesaPassword\" placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\" required autocomplete=\"current-password\" />\n      </div>\n      <button type=\"submit\" class=\"mesa-btn-primary\" id=\"mesaLoginBtn\">Entrar e Conectar Ao Vivo &rarr;</button>\n    </form>\n\n    <div id=\"mesaAuthMsg\" class=\"mesa-auth-msg\"></div>\n\n    <div class=\"mesa-cfg-toggle\">\n      <span id=\"mesaConnStatusLbl\">Servidor Supabase</span>\n      <button type=\"button\" id=\"mesaToggleCfgBtn\">\u2699\ufe0f Configurar URL / Key</button>\n    </div>\n\n    <div id=\"mesaCfgBox\">\n      <div class=\"mesa-field\">\n        <label for=\"mesaSupaUrl\">Supabase Project URL</label>\n        <input type=\"url\" id=\"mesaSupaUrl\" placeholder=\"https://xyzcompany.supabase.co\" />\n      </div>\n      <div class=\"mesa-field\">\n        <label for=\"mesaSupaAnon\">Supabase Anon Public Key</label>\n        <input type=\"text\" id=\"mesaSupaAnon\" placeholder=\"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\" />\n      </div>\n      <button type=\"button\" class=\"mesa-btn-primary\" id=\"mesaSaveCfgBtn\" style=\"background:#334155;font-size:12.5px;padding:8px 12px;\">Salvar Conex\u00e3o no Navegador</button>\n    </div>\n  </div>\n</div>\n\n<div id=\"mesaRealtimeToast\">\n  <span class=\"live-dot\"></span>\n  <span id=\"mesaRealtimeToastTxt\">Atualiza\u00e7\u00e3o em tempo real recebida!</span>\n</div>\n");

    document.getElementById('mesaToggleCfgBtn').onclick = () => {
      document.getElementById('mesaCfgBox').classList.toggle('open');
    };

    document.getElementById('mesaSaveCfgBtn').onclick = () => {
      const u = document.getElementById('mesaSupaUrl').value.trim();
      const k = document.getElementById('mesaSupaAnon').value.trim();
      if (!u || !k) {
        showMsg('Preencha a Project URL e a Anon Key do Supabase.', 'err');
        return;
      }
      localStorage.setItem('mesa_supa_url', u);
      localStorage.setItem('mesa_supa_anon', k);
      initSupabaseClient();
      document.getElementById('mesaCfgBox').classList.remove('open');
      showMsg('Conexão Supabase salva com sucesso! Faça login abaixo.', 'ok');
    };

    document.getElementById('mesaLoginForm').onsubmit = async (e) => {
      e.preventDefault();
      if (!supaClient && !initSupabaseClient()) {
        showMsg('Configure primeiro a URL e Anon Key do seu projeto Supabase.', 'err');
        return;
      }
      const email = document.getElementById('mesaEmail').value.trim();
      const password = document.getElementById('mesaPassword').value;
      const btn = document.getElementById('mesaLoginBtn');
      btn.disabled = true;
      btn.textContent = 'Autenticando no Supabase...';
      showMsg('', '');
      document.getElementById('mesaAuthMsg').style.display = 'none';

      const { data, error } = await supaClient.auth.signInWithPassword({ email, password });
      if (error) {
        btn.disabled = false;
        btn.textContent = 'Entrar e Conectar Ao Vivo →';
        showMsg('Erro de autenticação: ' + error.message, 'err');
        return;
      }
      await fetchAndHydrateDashboard(data.user);
    };

    const logoutBtn = document.getElementById('bLogout');
    if (logoutBtn) {
      logoutBtn.onclick = async () => {
        if (supaClient) await supaClient.auth.signOut();
        window.location.reload();
      };
    }

    if (initSupabaseClient()) {
      const { data } = await supaClient.auth.getSession();
      if (data && data.session && data.session.user) {
        await fetchAndHydrateDashboard(data.session.user);
      }
    }
  });
})();
</script>
<script>
window.__bootMesaEngine = function(){
'use strict';
const DATA=window.DATA;
const D=DATA, LOJAS=D.meta.lojas, IDS=(D.meta.ordem||Object.keys(D.meta.lojas)).filter(k=>D.meta.lojas[k]);
const LCOL={all:'var(--fg)'}, LNOME={all:'Consolidado'};
IDS.forEach((k,i)=>{LCOL[k]=i?'var(--blue)':'var(--orange)';LNOME[k]=LOJAS[k]});
const dm=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'n/d', dmy=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'n/d';
const UR=D.meta.ult_receb||{}, RWH=dm(UR[IDS[0]]), RTE=dm(UR[IDS[1]]);
const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mlabel=m=>MN[+m.slice(5)-1]+'/'+m.slice(2,4);
const nf0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const brl=n=>n==null||isNaN(n)?'–':(n<0?'−':'')+'R$ '+nf0.format(Math.abs(n));
const brlk=n=>{if(n==null||isNaN(n))return '–';const a=Math.abs(n),s=n<0?'−':'';return a>=1e6?s+'R$ '+nf1.format(a/1e6)+' mi':a>=1e4?s+'R$ '+nf0.format(a/1e3)+' mil':s+'R$ '+nf0.format(a)};
const pct=n=>n==null||!isFinite(n)?'–':(n<0?'−':'')+nf1.format(Math.abs(n))+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const div=(a,b)=>b?a/b:null;

/* ---------- estado ---------- */
const ALLM=[...new Set(D.vendas.map(r=>r.mes))].sort();
const MONTHS=ALLM;
const JP=(D.meta&&D.meta.janela_padrao)||{from:'2026-02',to:'2026-07'};
const S={loja:'all',from:JP.from,to:JP.to,base:'venc',tab:'painel',apres:false};
try{const x=JSON.parse(localStorage.getItem('mesa_state')||'{}');['loja','from','to','base','tab'].forEach(k=>{if(x[k])S[k]=x[k]});}catch(e){}
if(S.loja!=='all'&&!IDS.includes(S.loja))S.loja='all';
if(!MONTHS.includes(S.from))S.from=MONTHS[Math.max(0,MONTHS.indexOf(JP.from))]||MONTHS[0];if(!MONTHS.includes(S.to))S.to=MONTHS.includes(JP.to)?JP.to:MONTHS[MONTHS.length-1];
const save=()=>{try{localStorage.setItem('mesa_state',JSON.stringify({loja:S.loja,from:S.from,to:S.to,base:S.base,tab:S.tab}))}catch(e){}};
const lojas=()=>S.loja==='all'?IDS:[S.loja];
const rangeMonths=()=>MONTHS.filter(m=>m>=S.from&&m<=S.to);

/* ---------- índices ---------- */
const vIdx={},cIdx={},covIdx={},taxIdx={},dIdx={},rIdx={},gIdx={},dcIdx={};
D.vendas.forEach(r=>vIdx[r.idloja+'|'+r.mes]=r);
D.concil.forEach(r=>cIdx[r.idloja+'|'+r.mes]=r);
D.cobertura.forEach(r=>covIdx[r.idloja+'|'+r.mes]=r);
D.taxas.forEach(r=>{const k=r.idloja+'|'+r.mes;(taxIdx[k]=taxIdx[k]||{taxas:0,bruto:0});taxIdx[k].taxas+=r.taxas;taxIdx[k].bruto+=r.bruto});
D.desp.forEach(r=>{const k=r.idloja+'|'+r.base+'|'+r.mes;(dIdx[k]=dIdx[k]||[]).push(r)});
D.receb.forEach(r=>{const k=r.idloja+'|'+r.mes;(rIdx[k]=rIdx[k]||{})[r.tipo]=(rIdx[k][r.tipo]||0)+r.valor});
D.desc_classe.forEach(r=>{const k=r.idloja+'|'+r.mes;(dcIdx[k]=dcIdx[k]||{})[r.classe]=r.desconto});

function aggM(ids,m,base){
  const o={cort:0,bruto:0,desc:0,rec:0,serv:0,ped:0,lanc:0,excl:0,compras:0,emb:0,trib:0,taxas:0,cmo:0,prol:0,ret:0,ctoE:0,ctoA:0,adm:0,mkt:0,sis:0,inv:0,fin:0,acl:0,sub:{}};
  ids.forEach(id=>{
    const v=vIdx[id+'|'+m];if(v){o.bruto+=v.venda_bruta;o.desc+=v.descontos;o.rec+=v.venda_liquida;o.serv+=v.servico;o.ped+=v.pedidos_validos;o.lanc+=v.lancado;o.excl+=v.excluidos}
    const t=taxIdx[id+'|'+m];if(t)o.taxas+=t.taxas;
    const cc=cIdx[id+'|'+m];if(cc)o.cort+=cc.cortesias;
    (dIdx[id+'|'+base+'|'+m]||[]).forEach(r=>{
      const g=r.g,x=r.v;
      o.sub[g+'|'+r.s]=(o.sub[g+'|'+r.s]||0)+x;
      if(g==='CMV_COMPRAS_AB'){if(r.s==='Embalagens')o.emb+=x;else o.compras+=x}
      else if(g==='CSV')o.trib+=x;
      else if(g==='CMO')o.cmo+=x;
      else if(g==='SOCIOS'){if(r.s==='Pro-labore')o.prol+=x;else o.ret+=x}
      else if(g==='CTO_ESSENCIAL')o.ctoE+=x;else if(g==='CTO_AMPLIADO')o.ctoA+=x;
      else if(g==='ADMINISTRATIVAS'||g==='OUTRAS_OPERACIONAIS')o.adm+=x;
      else if(g==='MARKETING')o.mkt+=x;else if(g==='SISTEMAS')o.sis+=x;
      else if(g==='INVESTIMENTO_REVISAR')o.inv+=x;else if(g==='RESULTADO_FINANCEIRO')o.fin+=x;else o.acl+=x;
    });
  });
  return o;
}
function sumAgg(list){
  const o=aggM([],'',S.base);
  list.forEach(a=>{for(const k in a){if(k==='sub'){for(const s in a.sub)o.sub[s]=(o.sub[s]||0)+a.sub[s]}else o[k]+=a[k]}});
  return o;
}
const aggRange=(ids,months,base)=>sumAgg(months.map(m=>aggM(ids,m,base)));
function derive(a){
  a.cv=a.compras+a.emb;
  a.mc=a.rec-a.cv-a.taxas-a.trib;
  a.cto=a.ctoE+a.ctoA;
  a.opex=a.cmo+a.cto+a.adm+a.mkt+a.sis;
  a.ebitda=a.mc-a.opex;
  a.prime=a.cv+a.cmo;
  return a;
}
function covWarn(months){
  const bad=[];
  months.forEach(m=>{lojas().forEach(id=>{const c=covIdx[id+'|'+m];const st=c?c.cobertura:'PARCIAL';if(st!=='COMPLETO')bad.push({id,m,st})})});
  return bad;
}
function covBanner(months){
  const bad=covWarn(months);if(!bad.length)return '';
  const set=[...new Set(bad.map(b=>mlabel(b.m)))];
  return `<div class="banner"><b>Cobertura incompleta.</b> ${bad.length} mês(es)/loja no período (${esc(set.slice(0,8).join(', '))}${set.length>8?'…':''}) não têm despesas ou recebíveis completos no financeiro. Os custos e o EBITDA ficam subestimados nesses meses. A janela comparável é fev–jul/26.</div>`;
}
function chip(t){const m={ok:['Provisório · calculado','ok'],est:['Provisório · estimado','est'],pen:['Indisponível · pendente','pen'],na:['Indisponível','na']}[t];return `<span class="chip ${m[1]}">${m[0]}</span>`}

/* ---------- gráficos (SVG) ---------- */
const TIP=document.getElementById('tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){TIP.style.display='none';return}
  TIP.innerHTML=t.getAttribute('data-tip');TIP.style.display='block';
  const w=TIP.offsetWidth,h=TIP.offsetHeight;let x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;
  TIP.style.left=Math.max(4,x)+'px';TIP.style.top=Math.max(4,y)+'px';
});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&matchMedia('(hover:none)').matches){TIP.innerHTML=t.getAttribute('data-tip');TIP.style.display='block';TIP.style.left='12px';TIP.style.top='80px'}else if(!t)TIP.style.display='none'});
const niceMax=v=>{if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};
const axisFmt=(v,unit)=>unit==='%'?nf0.format(v)+'%':(v>=1e6?nf1.format(v/1e6)+' mi':v>=1e3?nf0.format(v/1e3)+' mil':nf0.format(v));
function legend(items){return `<div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`}
/* barras: series=[{name,color,vals[]}] ; stacked ou agrupadas */
function bars({cats,series,stacked,unit,h=240,tipFmt}){
  const W=720,H=h,L=46,R=10,T=10,B=26,pw=W-L-R,ph=H-T-B,n=cats.length;
  if(!n)return '<p class="note">Sem dados no período.</p>';
  const tot=cats.map((_,i)=>stacked?series.reduce((s,x)=>s+Math.max(0,x.vals[i]||0),0):Math.max(0,...series.map(x=>x.vals[i]||0)));
  const neg=cats.map((_,i)=>stacked?series.reduce((s,x)=>s+Math.min(0,x.vals[i]||0),0):Math.min(0,...series.map(x=>x.vals[i]||0)));
  const mx=niceMax(Math.max(...tot,0)),mn=Math.min(0,...neg);const lo=mn<0?-niceMax(-mn):0;
  const y=v=>T+ph*(1-(v-lo)/(mx-lo));const slot=pw/n,bw=Math.min(44,slot*.72);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let k=0;k<=4;k++){const v=lo+(mx-lo)*k/4;s+=`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${axisFmt(v,unit)}</text>`}
  s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`;
  const step=Math.ceil(n/12);
  cats.forEach((c,i)=>{
    const cx=L+slot*i+slot/2;
    if(i%step===0)s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(c)}</text>`;
    if(stacked){let pos=0,ng=0;series.forEach(x=>{const v=x.vals[i]||0;if(!v)return;const y0=v>=0?pos:ng;const y1=y0+v;if(v>=0)pos=y1;else ng=y1;
      const top=y(Math.max(y0,y1)),bh=Math.max(1,Math.abs(y(y0)-y(y1))-1.5);
      s+=`<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${bh}" rx="2" fill="${x.color}" data-tip="<b>${esc(c)}</b><br>${esc(x.name)}: ${tipFmt?tipFmt(v):brl(v)}"/>`})}
    else{const gw=bw/series.length;series.forEach((x,j)=>{const v=x.vals[i];if(v==null)return;const top=y(Math.max(v,0)),bh=Math.max(1,Math.abs(y(v)-y(0)));
      s+=`<rect x="${cx-bw/2+j*gw}" y="${top}" width="${Math.max(2,gw-2)}" height="${bh}" rx="2" fill="${x.color}" data-tip="<b>${esc(c)}</b><br>${esc(x.name)}: ${tipFmt?tipFmt(v):brl(v)}"/>`})}
  });
  return s+'</svg>';
}
function lines({cats,series,unit,h=220,tipFmt,minZero=true}){
  const W=720,H=h,L=46,R=14,T=10,B=26,pw=W-L-R,ph=H-T-B,n=cats.length;
  if(!n)return '<p class="note">Sem dados no período.</p>';
  const all=series.flatMap(x=>x.vals.filter(v=>v!=null));if(!all.length)return '<p class="note">Sem dados no período.</p>';
  const mx=niceMax(Math.max(...all)),mn0=Math.min(...all),lo=minZero?Math.min(0,mn0<0?-niceMax(-mn0):0):mn0*.9;
  const y=v=>T+ph*(1-(v-lo)/(mx-lo)),x=i=>n===1?L+pw/2:L+pw*i/(n-1);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let k=0;k<=4;k++){const v=lo+(mx-lo)*k/4;s+=`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${axisFmt(v,unit)}</text>`}
  const step=Math.ceil(n/12);cats.forEach((c,i)=>{if(i%step===0)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(c)}</text>`});
  series.forEach(se=>{
    let d='';se.vals.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)});
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" ${se.dash?'stroke-dasharray="5 4"':''}/>`;
    se.vals.forEach((v,i)=>{if(v==null)return;const last=i===n-1;s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?4.5:3}" fill="${se.color}" stroke="var(--surface)" stroke-width="2" data-tip="<b>${esc(cats[i])}</b><br>${esc(se.name)}: ${tipFmt?tipFmt(v):brl(v)}"/>`});
  });
  return s+'</svg>';
}
function hbars(rows,color,fmt){ // rows:[{label,v,tip,color}]
  const mx=Math.max(...rows.map(r=>Math.abs(r.v)),1);
  return rows.map(r=>`<div class="hbar" ${r.tip?`data-tip="${esc(r.tip)}"`:''}><span>${esc(r.label)}</span><div class="t"><div style="width:${Math.max(1,Math.abs(r.v)/mx*100)}%;background:${r.color||color||'var(--blue)'}"></div></div><span class="num">${fmt?fmt(r.v):brl(r.v)}</span></div>`).join('')||'<p class="note">Sem dados.</p>';
}
function heat(grid,days,hours){ // grid[d][h]
  const mx=Math.max(1,...grid.flat());const cw=34,ch=24,L=36,T=18;
  let s=`<svg viewBox="0 0 ${L+hours.length*cw} ${T+days.length*ch+4}" role="img">`;
  hours.forEach((h,j)=>{s+=`<text x="${L+j*cw+cw/2}" y="12" text-anchor="middle">${h}h</text>`});
  days.forEach((d,i)=>{s+=`<text x="${L-6}" y="${T+i*ch+16}" text-anchor="end">${d}</text>`;
    hours.forEach((h,j)=>{const v=grid[i][j]||0;const a=v/mx;s+=`<rect x="${L+j*cw+1}" y="${T+i*ch+1}" width="${cw-2}" height="${ch-2}" rx="3" fill="var(--blue)" fill-opacity="${(.08+a*.92).toFixed(2)}" data-tip="<b>${d} ${h}h</b><br>${brl(v)}"/>`})});
  return s+'</svg>';
}
function copyBtn(id,label){return `<button class="btn" type="button" data-copy="${id}">${label||'Copiar tabela (CSV)'}</button>`}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-copy]');if(!b)return;
  const t=document.getElementById(b.dataset.copy);if(!t)return;
  const csv=[...t.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>{const f=c.querySelector('input.resp,select.st');return '"'+(f?f.value:c.textContent).trim().replace(/"/g,'""')+'"'}).join(';')).join('\n');
  const done=()=>{const o=b.textContent;b.textContent='Copiado';setTimeout(()=>b.textContent=o,1400)};
  try{navigator.clipboard.writeText(csv).then(done,()=>{sel(t)})}catch(err){sel(t)}
  function sel(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selecionado: use Ctrl+C'}
});

/* ---------- telas ---------- */
const TABS=[['painel','Painel executivo'],['vendas','Vendas'],['perdas','Perdas operacionais'],['custos','Custos'],['dre','DRE Gerencial'],['dfc','DFC · Fluxo de caixa'],['caixa','Caixa e conciliação'],['qualidade','Qualidade dos dados'],['plano','Plano de ação'],['modelo','Cobertura e método'],['ponte','Resultado → Caixa'],['balanco','Posição patrimonial (parcial)'],['inteligencia','Inteligência de Vendas'],['respostas','Respostas gerenciais'],['homolog','Homologação']];
function periodLabel(){const m=rangeMonths();return m.length?mlabel(m[0])+' a '+mlabel(m[m.length-1])+' ('+m.length+' '+(m.length>1?'meses':'mês')+')':'sem meses'}
function head(t,p){return `<div class="h"><div><h2>${t}</h2><p>${p}</p></div><span class="tag">${LNOME[S.loja]} · ${periodLabel()}</span></div>`}
function seriesByLoja(months,fn){const ids=S.loja==='all'?IDS:[S.loja];return ids.map(id=>({name:LNOME[id],color:LCOL[id],vals:months.map(m=>fn(id,m))}))}

function yoy(ids,months){
  const prev=months.map(m=>(+m.slice(0,4)-1)+m.slice(4));
  const a=ids.reduce((s,id)=>s+months.reduce((x,m)=>x+(vIdx[id+'|'+m]?vIdx[id+'|'+m].venda_liquida:0),0),0);
  const b=ids.reduce((s,id)=>s+prev.reduce((x,m)=>x+(vIdx[id+'|'+m]?vIdx[id+'|'+m].venda_liquida:0),0),0);
  const okPrev=prev.every(m=>ids.every(id=>vIdx[id+'|'+m]));
  return okPrev&&b?{g:(a/b-1)*100,prev:b}:null;
}

function ahv(cur,prev){
  if(cur==null||prev==null)return null;
  const abs=cur-prev;
  if(prev===0)return {abs,p:null,na:true};
  return {abs,p:abs/Math.abs(prev)*100,negBase:prev<0};
}
function ahCell(row,cur,prev,blocked){
  if(row.k==='da')return '<td class="num ah">–</td>';
  if(blocked)return '<td class="num ah na" data-tip="Base de comparação sem cobertura completa do financeiro: variação indisponível.">n/d</td>';
  const v=ahv(cur,prev);if(!v)return '<td class="num ah">–</td>';
  const tipBase=`Atual ${brl(cur)} · Anterior ${brl(prev)} · Variação ${brl(v.abs)}`;
  if(v.na)return `<td class="num ah na" data-tip="${esc(tipBase)}. Base anterior igual a zero: % não definida.">N/A</td>`;
  const cls=row.memo?'ind':(v.abs>0?'good':v.abs<0?'crit':'');
  const arrow=v.abs>0?'▲':v.abs<0?'▼':'■';
  const over=!row.memo&&Math.abs(v.p)>limOf(row.k)&&v.abs<0;
  const ev=row.memo?'indeterminada (memo)':v.abs>0?'favorável':v.abs<0?'desfavorável':'estável';

}

function flowOf(accts,m){
  const o={ent:{},sai:{},taxas:0,inv:{},fin:{},tIn:0,tOut:0,n:0,dup:0,semTit:0};
  accts.forEach(a=>(dfcIdx[a.key+'|'+m]||[]).forEach(r=>{
    const cr=r.sentido==='CREDITO';o.n+=r.n;o.dup+=r.v_dup||0;o.semTit+=r.n_sem_titulo||0;
    if(r.secao==='TRANSF'){if(cr)o.tIn+=r.liquido;else o.tOut+=r.liquido}
    else if(r.secao==='OP_ENTRADA'){add(o.ent,r.linha,r.bruto);o.taxas+=r.bruto-r.liquido}
    else if(r.secao==='OP_SAIDA')add(o.sai,r.linha,r.liquido);
    else if(r.secao==='INVESTIMENTO')add(o.inv,r.linha,cr?r.liquido:-r.liquido);
    else if(r.secao==='FINANCIAMENTO')add(o.fin,r.linha,cr?r.liquido:-r.liquido);

  return o;

const sumO=o=>Object.values(o).reduce((s,x)=>s+x,0);
const fx={entT:f=>sumO(f.ent),saiT:f=>f.taxas+sumO(f.sai),op:f=>sumO(f.ent)-f.taxas-sumO(f.sai),invT:f=>sumO(f.inv),finT:f=>sumO(f.fin)};
fx.liq=f=>fx.op(f)+fx.invT(f)+fx.finT(f);fx.transf=f=>f.tIn-f.tOut;fx.net=f=>fx.liq(f)+fx.transf(f);
const netKey=(key,m)=>{let s=0;(dfcIdx[key+'|'+m]||[]).forEach(r=>{s+=(r.sentido==='CREDITO'?1:-1)*r.liquido});return s};
/* saldo de abertura do mês `first` para a conta: manual (simulação) tem prioridade; senão âncora do sistema (gw_financeiro_saldo) */
function openBal(key,first){
  let src=null,open=null,v=null,kind=null;
  const man=S.si[key];
  if(man&&man.v!=null&&man.v!==''){open=man.m;v=+man.v;kind='manual'}
  else if(ANCH[key]){open=ANCH[key].open;v=ANCH[key].v;kind='sistema'}
  if(kind==null)return {v:null,kind:'indisp'};
  let s=v;
  if(first>=open){DFC_MONTHS.forEach(m=>{if(m>=open&&m<first)s+=netKey(key,m)})}
  else{DFC_MONTHS.forEach(m=>{if(m>=first&&m<open)s-=netKey(key,m)})}
  return {v:s,kind};
}
/* premissas de projeção a partir da média dos meses-base (selecionando as contas) */
function baseAvg(accts){
  const o={ent:{},sai:{},inv:{},fin:{},taxas:0};
  DFC_BASE.forEach(m=>{const f=flowOf(accts,m);['ent','sai','inv','fin'].forEach(g=>{for(const k in f[g])add(o[g],k,f[g][k])});o.taxas+=f.taxas});
  const n=DFC_BASE.length;['ent','sai','inv','fin'].forEach(g=>{for(const k in o[g])o[g][k]/=n});o.taxas/=n;
  return o;
}
function projFlows(accts,scn){
  const b=baseAvg(accts),sc=S.sc,out=[];
  const entBase=b.ent['Recebimentos de vendas']||0,taxaR=entBase?b.taxas/entBase:0;
  for(let i=0;i<12;i++){
    const f={ent:{},sai:{},taxas:0,inv:{},fin:{},tIn:0,tOut:0,n:0,dup:0,semTit:0};
    ENT_L.forEach(L=>{const base=NONREC.has(L)?0:(b.ent[L]||0);const ov=sc.over['e|'+L];f.ent[L]=(ov!=null&&ov!=='')?+ov:base*(scn?(1+sc.cresc/100):1)});
    SAI_L.forEach(L=>{const base=NONREC.has(L)?0:(b.sai[L]||0);const ov=sc.over['s|'+L];f.sai[L]=((ov!=null&&ov!=='')?+ov:base)*(scn?(1+sc.dvar/100):1)});
    INV_L.concat(FIN_L).forEach(L=>{const g=INV_L.includes(L)?f.inv:f.fin;const base=NONREC.has(L)?0:(b[INV_L.includes(L)?'inv':'fin'][L]||0);g[L]=base});
    f.taxas=(f.ent['Recebimentos de vendas']||0)*taxaR;
    out.push(f);
  }
  if(scn){
    const e0=out[0].ent['Recebimentos de vendas'];
    if(sc.ant>0&&out.length>1){const mv=(out[1].ent['Recebimentos de vendas'])*sc.ant/100;out[0].ent['Recebimentos de vendas']+=mv;out[1].ent['Recebimentos de vendas']-=mv;const t0=mv*taxaR;out[0].taxas+=t0;out[1].taxas-=t0}
    if(sc.adi>0&&out.length>1){const L='Fornecedores (compras A&B e embalagens)';const mv=out[0].sai[L]*sc.adi/100;out[0].sai[L]-=mv;out[1].sai[L]+=mv}
    if(sc.inv>0){const i=Math.min(11,Math.max(0,sc.invM-1));out[i].inv['Investimentos (a revisar)']=(out[i].inv['Investimentos (a revisar)']||0)-sc.inv}
    if(sc.apo>0){const i=Math.min(11,Math.max(0,sc.apoM-1));out[i].fin['Aportes de socios']=(out[i].fin['Aportes de socios']||0)+sc.apo}
  }

const scnActive=()=>{const s=S.sc;return !!(s.cresc||s.dvar||s.ant||s.adi||s.inv||s.apo)};
function compromissos(ids){

function buildCols(accts){

function dfcRows(cols){
  const has=(g,L)=>cols.some(c=>Math.abs((c.f[g][L]||0))>0.5);
  const R=[];
  const row=(n,get,o={})=>R.push(Object.assign({n,get},o));
  row('SALDO INICIAL',c=>c.si,{k:'si',bal:1,tot:1});
  row('ENTRADAS OPERACIONAIS',null,{hdr:1});
  ENT_L.forEach(L=>{if(L==='Recebimentos de vendas'||has('ent',L))row(LBL[L],c=>c.f.ent[L]||0,{k:'e|'+L,sub:1,lin:'ent',L})});
  row('(=) Total de entradas operacionais',c=>fx.entT(c.f),{k:'entT',tot:1});
  row('SAÍDAS OPERACIONAIS',null,{hdr:1});
  row('(−) Taxas comerciais descontadas na liquidação',c=>-c.f.taxas,{k:'taxas',sub:1});
  SAI_L.forEach(L=>{if(has('sai',L))row('(−) '+LBL[L],c=>-(c.f.sai[L]||0),{k:'s|'+L,sub:1,lin:'sai',L})});
  row('(=) Total de saídas operacionais',c=>-fx.saiT(c.f),{k:'saiT',tot:1});
  row('(=) FLUXO OPERACIONAL',c=>fx.op(c.f),{k:'op',tot:1});
  row('INVESTIMENTO',null,{hdr:1});
  INV_L.forEach(L=>row(LBL[L],c=>c.f.inv[L]||0,{k:'i|'+L,sub:1,lin:'inv',L}));
  row('(=) Fluxo de investimento',c=>fx.invT(c.f),{k:'invT',tot:1});
  row('FINANCIAMENTO',null,{hdr:1});
  FIN_L.forEach(L=>{if(has('fin',L)||L==='Emprestimos recebidos'||L==='Retiradas e distribuicao de lucros')row(LBL[L],c=>c.f.fin[L]||0,{k:'f|'+L,sub:1,lin:'fin',L})});
  row('(=) Fluxo de financiamento',c=>fx.finT(c.f),{k:'finT',tot:1});
  row('(=) FLUXO LÍQUIDO (sem transferências)',c=>fx.liq(c.f),{k:'liq',tot:1});
  row('Transferências entre contas (líquido)',c=>fx.transf(c.f),{k:'transf',sub:1,memo:1});
  row('Variação acumulada de caixa no período',c=>c.cum,{k:'cum',memo:1,sub:1});
  row('SALDO FINAL',c=>c.sf,{k:'sf',bal:1,tot:1});
  return R;
}

/* ---------- MESA 3.9.3 · DRE Gerencial único: expansão linha → subgrupo → contas → fornecedores (sem reclassificar) ---------- */
let DRE3_KEYS={rows:[],contas:[],forn:[]};
const n3=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase();
/* vínculo gerencial: grupo/subgrupo do lançamento (mesa.v_fin_aj) -> linha do DRE. Mesma regra de aggM(). */
const DRE3_ROW=(g,s)=>{
  if(g==='CMV_COMPRAS_AB')return 'cv';if(g==='CSV')return 'trib';if(g==='CMO')return 'cmo';
  if(g==='CTO_ESSENCIAL'||g==='CTO_AMPLIADO')return 'cto';
  if(g==='ADMINISTRATIVAS'||g==='OUTRAS_OPERACIONAIS')return 'adm';
  if(g==='MARKETING')return 'mkt';if(g==='SISTEMAS')return 'sis';
  if(g==='SOCIOS')return s==='Pro-labore'?'prol':'ret';
  if(g==='INVESTIMENTO_REVISAR')return 'inv';if(g==='RESULTADO_FINANCEIRO')return 'fin';
  return null;
};
const DRE3_LIM={taxas:'Detalhe por meio de pagamento. Não há fornecedor associado a esta linha.',excl:'Origem no PDV. Sem detalhe financeiro por fornecedor.',cort:'Origem no PDV. Sem detalhe financeiro por fornecedor.',serv:'Origem no PDV. Sem detalhe financeiro por fornecedor.'};
function dre3Tree(ids,ms,base){
  const fld={emissao:'em',venc:'vc',caixa:'cx'}[base],idx={};ms.forEach((m,i)=>idx[m]=i);
  const mk=()=>({v:ms.map(()=>0),c:Object.create(null)});
  const roots={};
  (D.dre_lanc||[]).forEach(r=>{
    if(r.rn_dup!==1||!r.g||!ids.includes(String(r.idloja)))return;
    const d=r[fld];if(!d)return;const i=idx[d.slice(0,7)];if(i===undefined)return;
    const rk=DRE3_ROW(r.g,r.s);if(!rk)return;
    const sg=r.s||'(sem subgrupo)',parts=new Set(n3(sg).split('/').map(x=>x.trim()));parts.add(n3(sg));
    const path=[sg];
    [r.p3,r.p4].forEach(x=>{const t=String(x||'').trim();if(t&&!parts.has(n3(t))&&n3(t)!==n3(path[path.length-1]))path.push(t)});
    path.push(String(r.forn||'').trim()||'(sem nome informado)');
    let node=roots[rk]=roots[rk]||mk();node.v[i]+=r.v;
    path.forEach(n=>{node=node.c[n]=node.c[n]||mk();node.v[i]+=r.v});
  });
  const keys={rows:[],contas:[],forn:[]},leaf={};
  const has=o=>Object.keys(o.c).length>0;
  const walk=(node,key,rk)=>Object.entries(node.c).forEach(([n,o])=>{
    const k=key+'¦'+n;
    if(has(o)){keys.forn.push(k);if(Object.values(o.c).some(has))keys.contas.push(k);walk(o,k,rk)}
    else leaf[rk]=(leaf[rk]||0)+o.v.reduce((s,x)=>s+x,0);
  });
  Object.keys(roots).forEach(rk=>walk(roots[rk],'d3:'+rk,rk));
  return {roots,keys,leaf};
}
/* prova por linha: valor do DRE gerencial = soma analítica (por mês, período e soma dos fornecedores) */
function dre3Prove(d3,cols,T){
  const ok={},dif={};
  DRE_ROWS.forEach(r=>{
    const root=d3.roots[r.k];if(!root)return;
    const dm=cols.map((a,i)=>r.fn(a)+root.v[i]);
    const dt=r.fn(T)+root.v.reduce((s,x)=>s+x,0);
    const dl=r.fn(T)+(d3.leaf[r.k]||0);
    dif[r.k]={gerencial:r.fn(T),folhas:-(d3.leaf[r.k]||0),dif:Math.abs(dl)<0.005?0:dl};
    ok[r.k]=dm.every(x=>Math.abs(x)<0.02)&&Math.abs(dt)<0.02&&Math.abs(dl)<0.02;
  });
  return {ok,dif};
}
function dre3Rows(rk,root,cols,T,cs){
  const bl=S.ah&&cs.col?'<td></td>':'';let out='';
  const z=v=>0-v;
  const cell=(vals,tot)=>cols.map((a,i)=>`<td class="num">${brl(z(vals[i]))}</td>${S.av?`<td class="num av">${a.rec?pct(z(vals[i])*100/a.rec):'N/A'}</td>`:''}${bl}`).join('')
    +`<td class="num">${brl(z(tot))}</td>${S.av?`<td class="num av">${T.rec?pct(z(tot)*100/T.rec):'N/A'}</td>`:''}${S.ah?'<td></td><td></td>':''}${cs.acum?`<td></td>${S.av?'<td></td>':''}<td></td><td></td>`:''}`;
  const walk=(node,key,depth)=>{
    Object.entries(node.c).map(([n,o])=>({n,o,t:o.v.reduce((s,x)=>s+x,0)}))
      .filter(e=>Math.abs(e.t)>0.005||e.o.v.some(x=>Math.abs(x)>0.005)).sort((a,b)=>b.t-a.t)
      .forEach(({n,o,t})=>{
        const k=key+'¦'+n,has=Object.keys(o.c).length>0,open=!!S.exp[k];
        const btn=has?`<button type="button" class="xp" data-exp="${esc(k)}" aria-expanded="${open}" title="${open?'Recolher':'Expandir'}">${open?'▾':'▸'}</button>`:'<span class="xp" style="visibility:hidden">▸</span>';
        out+=`<tr class="sub det"><td style="padding-left:${24+depth*18}px">${btn}${esc(n)}</td>${cell(o.v,t)}</tr>`;
        if(has&&open)walk(o,k,depth+1);
      });
  };
  walk(root,'d3:'+rk,0);
  return out;
}
document.addEventListener('click',e=>{

/* ---- Q9: o que explica a variação da receita (volume x preço por grupo e produto) ---- */
function rgVariacao(){
  const ms=rangeMonths();if(!ms.length)return '';
  const n=ms.length,a0=RG.cmp==='ano'?addM(S.from,-12):addM(S.from,-n),a1=RG.cmp==='ano'?addM(S.to,-12):addM(S.from,-1);
  const lab=RG.cmp==='ano'?'mesmo período do ano anterior':'período imediatamente anterior';
  const sel=`<span class="fg"><span>Comparar com</span><select data-rg="cmp"><option value="ant" ${RG.cmp==='ant'?'selected':''}>Período anterior</option><option value="ano" ${RG.cmp==='ano'?'selected':''}>Mesmo período do ano anterior</option></select></span>`;
  if(a0<MD)return rgCard(9,'Variação da receita por categoria e produto','Pergunta 9 · parcial',sel+`<p class="note">O detalhe por produto começa em ${mlabel(MD)}. O período de comparação (${mlabel(a0)} a ${mlabel(a1)}) começa antes disso; escolha um período mais recente.</p>`);
  const agg=(m0,m1)=>{const o={};D.vprod.filter(r=>lojas().includes(String(r.idloja))&&r.mes>=m0&&r.mes<=m1).forEach(r=>{const k=r.produto,x=o[k]=o[k]||{v:0,q:0,g:r.grupo};x.v+=r.v;x.q+=r.qtd});return o};
  const cur=agg(S.from,S.to),old=agg(a0,a1);
  const keys=new Set([...Object.keys(cur),...Object.keys(old)]);
  const P=[...keys].map(k=>{const c=cur[k]||{v:0,q:0,g:(old[k]||{}).g},o=old[k]||{v:0,q:0,g:c.g};
    const p0=o.q>0?o.v/o.q:null,p1=c.q>0?c.v/c.q:null;
    let ev=null,ep=null;if(p0!=null&&c.q>0){ev=(c.q-o.q)*p0;ep=c.q*(p1-p0)}else if(o.q>0&&c.q===0){ev=c.v-o.v;ep=0}else{ev=c.v-o.v;ep=0}
    return {k,g:c.g||o.g||'(sem grupo)',v1:c.v,v0:o.v,d:c.v-o.v,ev,ep,q1:c.q,q0:o.q}});
  const tot=P.reduce((s,r)=>s+r.d,0),G={};
  P.forEach(r=>{const x=G[r.g]=G[r.g]||{g:r.g,v1:0,v0:0,d:0,ev:0,ep:0};x.v1+=r.v1;x.v0+=r.v0;x.d+=r.d;x.ev+=r.ev;x.ep+=r.ep});
  const gr=Object.values(G).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  const vend=(m0,m1)=>lojas().reduce((s,id)=>s+MONTHS.filter(m=>m>=m0&&m<=m1).reduce((x,m)=>x+(vIdx[id+'|'+m]?vIdx[id+'|'+m].venda_liquida:0),0),0);
  const dv=vend(S.from,S.to)-vend(a0,a1);
  const top=P.slice().sort((a,b)=>b.d-a.d),up=top.filter(r=>r.d>0).slice(0,8),dn=top.reverse().filter(r=>r.d<0).slice(0,8);
  const cell=r=>[esc(r.k)+'<br><span class="note">'+esc(r.g)+'</span>',brl(r.v0),brl(r.v1),brl(r.d),brl(r.ev),brl(r.ep),tot?pct(div(r.d*100,Math.abs(tot))):'–'];
  return rgCard(9,'Variação da receita por categoria e produto',`Pergunta 9 · compara ${mlabel(S.from)} a ${mlabel(S.to)} com o ${lab} (${mlabel(a0)} a ${mlabel(a1)}). Efeito volume = variação de quantidade × preço médio antigo; efeito preço = quantidade nova × variação de preço médio. Produto novo ou descontinuado entra todo como volume.`,
   sel+`<div class="grid" style="margin-top:8px">${KPI('Variação da venda líquida (produtos)',brl(tot),`${pct(div(tot*100,P.reduce((s,r)=>s+r.v0,0)))} sobre o período de comparação`)}${KPI('Efeito volume',brl(P.reduce((s,r)=>s+r.ev,0)),'Quantidade vendida')}${KPI('Efeito preço / mix',brl(P.reduce((s,r)=>s+r.ep,0)),'Preço médio praticado')}${KPI('Diferença para a venda líquida do financeiro',brl(tot-dv),Math.abs(tot-dv)<1?'Conciliado':'Arredondamento ou produtos sem grupo; conferir')}</div>`
   +`<h4 style="margin:12px 0 4px">Por grupo</h4>`+rgTbl(['Grupo','Comparação','Período','Variação','Efeito volume','Efeito preço','% da variação'],gr.map(r=>rgTd(esc(r.g),brl(r.v0),brl(r.v1),brl(r.d),brl(r.ev),brl(r.ep),tot?pct(div(r.d*100,Math.abs(tot))):'–')))
   +`<div class="two"><div><h4 style="margin:12px 0 4px">Produtos que mais cresceram</h4>${rgTbl(['Produto','Comparação','Período','Variação','Volume','Preço','% da variação'],up.map(r=>rgTd(...cell(r))))}</div>
   <div><h4 style="margin:12px 0 4px">Produtos que mais caíram</h4>${rgTbl(['Produto','Comparação','Período','Variação','Volume','Preço','% da variação'],dn.map(r=>rgTd(...cell(r))))}</div></div>
   <p class="note">Limite: a variação mostra o que mudou, não a causa. Sazonalidade, preço, falta de produto ou mudança de cardápio são hipóteses a investigar com o gestor. O detalhe por produto só existe a partir de ${mlabel(MD)}.</p>`);
}

/* ---- Q5: priorização de ações ---- */
function rgPriorizacao(){
  screenPlano();const IT=window.__planoItems||[];
  const sv=RGLS('mesa_prior',{});
  const esf={'30 dias':2,'30 a 60 dias':3,'60 dias':3,'90 dias':4};
  const conf=i=>/folha|invent|pendur/i.test(IT[i][0])?2:4;
  const imp=i=>{const t=IT[i][2],m=t.match(/R\$\s*([\d.]+)(\s*mil)?/);if(!m)return 3;let v=+m[1].replace(/\./g,'');if(m[2])v*=1000;return v>=30685?5:v>=12274?4:v>=3068?3:2};
  const rows=IT.map((r,i)=>{const o=sv[i]||{},I=+(o.i||imp(i)),E=+(o.e||esf[r[3]]||3),C=+(o.c||conf(i));return {i,r,I,E,C,s:I*C/E}});
  const rank=rows.slice().sort((a,b)=>b.s-a.s),pos={};rank.forEach((x,k)=>pos[x.i]=k+1);
  const opt=(i,k,v)=>`<select data-prior="${i}|${k}">${[1,2,3,4,5].map(n=>`<option ${n===v?'selected':''}>${n}</option>`).join('')}</select>`;
  return rgCard(5,'Priorização das ações: impacto, esforço e confiança',`Pergunta 5 · pontuação = impacto × confiança ÷ esforço (1 a 5 cada). Os valores iniciais são sugestões MESA com regra explícita; o gestor deve ajustá-los. Alterações ficam salvas neste navegador.`,
   `<div class="tw"><table><tr><th class="l">Posição</th><th class="l">Ação</th><th class="l">Impacto declarado</th><th>Impacto</th><th>Esforço</th><th>Confiança</th><th>Pontuação</th></tr>${rank.map(x=>`<tr${pos[x.i]<=3?' style="background:var(--surface2,rgba(0,0,0,.04))"':''}><td class="l"><b>${pos[x.i]}${pos[x.i]<=3?' ★':''}</b></td><td class="l" style="white-space:normal;min-width:260px">${x.r[0]}</td><td class="l" style="white-space:normal;min-width:180px">${x.r[2]}</td><td class="num">${opt(x.i,'i',x.I)}</td><td class="num">${opt(x.i,'e',x.E)}</td><td class="num">${opt(x.i,'c',x.C)}</td><td class="num"><b>${x.s.toFixed(1)}</b></td></tr>`).join('')}</table></div>`
   +`<p class="note"><b>Regra das sugestões:</b> impacto 5, 4, 3 ou 2 conforme o valor em R$ citado na ação (≥ R$ 30,7 mil, ≥ R$ 12,3 mil, ≥ R$ 3,1 mil, menor; faixas na escala da demonstração), e 3 quando o impacto é qualitativo; esforço pelo prazo (30 dias = 2, 30 a 60 e 60 dias = 3, 90 dias = 4); confiança 4 quando o dado existe na cópia e 2 quando depende de dado ausente (folha, inventário) ou de baixa não registrada (pendurados, pois valor pago está zerado em todos os registros). Estas notas são ponto de partida, não um julgamento do gestor.</p>`);
}

/* ===== MESA 3.9.5 · Resultado → Caixa (ponte DRE ↔ DFC) · PROVISÓRIO ===== */
function ponteCalc(ids,ms,accts){
  const dre=derive(aggRange(ids,ms,'caixa'));
  const F={ent:{},sai:{},taxas:0,inv:{},fin:{},tIn:0,tOut:0};
  const per=[];
  ms.forEach(m=>{
    const f=flowOf(accts,m);
    ['ent','sai','inv','fin'].forEach(g=>{for(const k in f[g])add(F[g],k,f[g][k])});
    F.taxas+=f.taxas;F.tIn+=f.tIn;F.tOut+=f.tOut;
    const d=derive(aggM(ids,m,'caixa'));
    per.push({m,ebitda:d.ebitda,op:fx.op(f),liq:fx.liq(f),rec:d.rec,ent:(f.ent['Recebimentos de vendas']||0)});
  });
  const e=k=>F.ent[k]||0,s=k=>F.sai[k]||0,i=k=>F.inv[k]||0,fi=k=>F.fin[k]||0;
  const L=[];
  const mk=(sec,n,dr,df,lei,fonte)=>L.push({sec,n,dr,df,lei,fonte});
  mk('A','Receita × recebimentos de vendas',dre.rec,e('Recebimentos de vendas'),'Receita pelo PDV (data da venda) contra títulos de recebimento liquidados (data de caixa, valor bruto). A diferença pode reunir vendas em dinheiro fora dos títulos, defasagem de liquidação, pendurados e cortesias, e recebíveis não lançados. Causa não atribuída.'+(dre.serv?' Taxa de serviço do período: '+brl(dre.serv)+' (fora da receita da DRE, mas incluída no que foi recebido).':''),'PDV × gw_financeiro_livrocaixa');
  mk('A','Taxas de cartão',-dre.taxas,-F.taxas,'No DFC as taxas saem do recebimento (bruto − líquido). Na DRE vêm da configuração das formas de recebimento, não de extrato da adquirente.','gw_formas_recebimento × títulos');
  mk('A','Compras AB e embalagens',-dre.cv,-s('Fornecedores (compras A&B e embalagens)'),'Mesma classificação nas duas visões. Diferença vem do critério de data (compensação × livro-caixa).','mesa.v_fin_aj × livro-caixa');
  mk('A','Tributos sobre receita',-dre.trib,-s('Tributos sobre vendas (CSV)'),'Idem.','mesa.v_fin_aj × livro-caixa');
  mk('A','CMO (sem sócios)',-dre.cmo,-s('Salarios, encargos e beneficios (CMO)'),'Idem.','mesa.v_fin_aj × livro-caixa');
  mk('A','CTO',-dre.cto,-s('Aluguel e ocupacao (CTO)'),'Idem.','mesa.v_fin_aj × livro-caixa');
  mk('A','Administrativas e outras operacionais',-dre.adm,-(s('Administrativas')+s('Outras saidas operacionais')),'Idem.','mesa.v_fin_aj × livro-caixa');
  mk('A','Marketing',-dre.mkt,-s('Marketing'),'Idem.','mesa.v_fin_aj × livro-caixa');
  mk('A','Sistemas e tecnologia',-dre.sis,-s('Sistemas e tecnologia'),'Idem.','mesa.v_fin_aj × livro-caixa');
  const subA=L.filter(x=>x.sec==='A');
  const sub={dr:subA.reduce((t,x)=>t+x.dr,0),df:subA.reduce((t,x)=>t+x.df,0)};
  mk('B','Pró-labore',-dre.prol,-s('Pro-labore'),'Sócios: fora do EBITDA, mas é saída de caixa.','mesa.v_fin_aj (SOCIOS)');
  mk('B','Outras entradas a classificar',0,e('Outras entradas a classificar'),'Entradas do livro-caixa sem origem comprovada (ex.: transferência bancária operacional, aportes). Não são receita da DRE. Precisam de classificação do gestor.','livro-caixa');
  mk('B','Saídas a classificar / outras classificações',-dre.acl,-s('Saidas a classificar'),'Sem classificação definida nas duas visões.','livro-caixa × v_fin_aj');
  mk('C','Investimentos (a revisar)',-dre.inv,i('Investimentos (a revisar)'),'Obras e equipamentos: confirmar se são investimento.','INVESTIMENTO_REVISAR');
  mk('C','Juros, tarifas e amortização',-dre.fin,fi('Juros, tarifas e amortizacao'),'Resultado financeiro lançado.','RESULTADO_FINANCEIRO');
  mk('C','Retiradas e distribuição de lucros',-dre.ret,fi('Retiradas e distribuicao de lucros'),'Não é despesa da DRE, mas reduz o caixa.','SOCIOS');
  mk('C','Empréstimos recebidos',0,fi('Emprestimos recebidos'),'Financiamento: entrada de caixa sem efeito no resultado.','livro-caixa');
  mk('C','Aportes de sócios',0,fi('Aportes de socios'),'Entrada de caixa sem efeito no resultado.','livro-caixa');
  const mapped=new Set(['Recebimentos de vendas','Outras entradas a classificar','Fornecedores (compras A&B e embalagens)','Salarios, encargos e beneficios (CMO)','Pro-labore','Aluguel e ocupacao (CTO)','Tributos sobre vendas (CSV)','Administrativas','Marketing','Sistemas e tecnologia','Outras saidas operacionais','Saidas a classificar','Investimentos (a revisar)','Juros, tarifas e amortizacao','Retiradas e distribuicao de lucros','Emprestimos recebidos','Aportes de socios']);
  let outras=0;
  Object.keys(F.ent).forEach(k=>{if(!mapped.has(k))outras+=F.ent[k]});
  Object.keys(F.sai).forEach(k=>{if(!mapped.has(k))outras-=F.sai[k]});
  Object.keys(F.inv).forEach(k=>{if(!mapped.has(k))outras+=F.inv[k]});
  Object.keys(F.fin).forEach(k=>{if(!mapped.has(k))outras+=F.fin[k]});
  mk('C','Outras linhas do DFC não mapeadas',0,outras,'Deve ser zero. Se aparecer valor, há linha nova no DFC sem tratamento na ponte.','—');
  const totDR=L.reduce((t,x)=>t+x.dr,0),totDF=L.reduce((t,x)=>t+x.df,0);
  return {dre,F,L,sub,totDR,totDF,dfcLiq:fx.liq(F),dfcOp:fx.op(F),transf:F.tIn-F.tOut,per};
}
function screenPonte(){
  const ids=lojas(),all=rangeMonths(),ms=all.filter(m=>DFC_MONTHS.includes(m)),accts=selAccts();
  const h=head('Resultado → Caixa','Ponte entre o EBITDA gerencial (DRE) e o fluxo de caixa (DFC), linha a linha. Mostra por que lucro e caixa não coincidem. Provisório; não é balanço nem DFC indireto contábil.');
  if(!ms.length)return h+`<div class="banner"><b>Sem meses com DFC no período.</b> O fluxo de caixa existe de ${mlabel(DFC_MONTHS[0])} a ${mlabel(DFC_MONTHS[DFC_MONTHS.length-1])}. Ajuste o período para essa janela.</div>`;
  const P=ponteCalc(ids,ms,accts);
  const skipped=all.length-ms.length;
  const dif=P.totDF-P.totDR;
  const sumDif=P.L.reduce((t,x)=>t+(x.df-x.dr),0);
  const proof=Math.abs(sumDif-dif)<0.5;
  const conv=P.dre.ebitda>0?pct(P.dfcOp*100/P.dre.ebitda):'N/A';
  const kpi=(t,v,s)=>`<div class="card kpi"><h3>${t}</h3><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const kp=`<div class="grid">${kpi('EBITDA gerencial aprox. (DRE, base caixa)',brlk(P.dre.ebitda),'Receita PDV − custos pela data de caixa '+chip('est'))}${kpi('Fluxo operacional (DFC)',brlk(P.dfcOp),'Entradas − taxas − saídas operacionais '+chip('est'))}${kpi('Fluxo líquido (DFC, sem transferências)',brlk(P.dfcLiq),'Após investimento e financiamento '+chip('est'))}${kpi('Fluxo operacional ÷ EBITDA',conv,P.dre.ebitda>0?'Quanto do resultado virou caixa operacional':'EBITDA não positivo: razão não aplicável')}</div>`;
  const row=(x)=>{const d=x.df-x.dr;return `<tr><td>${esc(x.n)}</td><td class="num">${brl(x.dr)}</td><td class="num">${brl(x.df)}</td><td class="num"><b>${brl(d)}</b></td><td class="note" style="text-align:left;min-width:300px;white-space:normal;font-weight:400">${esc(x.lei)}</td><td class="note" style="text-align:left;min-width:300px;white-space:normal;font-weight:400">${esc(x.fonte)}</td></tr>`};
  const secRow=t=>`<tr class="tot"><td colspan="6"><b>${t}</b></td></tr>`;
  let body=secRow('A · Operação (compõe o EBITDA gerencial)')+P.L.filter(x=>x.sec==='A').map(row).join('');
  body+=`<tr class="tot"><td><b>Subtotal operacional</b></td><td class="num"><b>${brl(P.sub.dr)}</b></td><td class="num"><b>${brl(P.sub.df)}</b></td><td class="num"><b>${brl(P.sub.df-P.sub.dr)}</b></td><td class="note" style="text-align:left;min-width:300px;white-space:normal;font-weight:400">DRE: igual ao EBITDA gerencial aprox. (${brl(P.dre.ebitda)}).</td><td></td></tr>`;
  body+=secRow('B · Itens de sócios e sem classificação (fora do EBITDA)')+P.L.filter(x=>x.sec==='B').map(row).join('');
  body+=secRow('C · Investimento, financiamento e sócios')+P.L.filter(x=>x.sec==='C').map(row).join('');
  body+=`<tr class="tot"><td><b>Total</b></td><td class="num"><b>${brl(P.totDR)}</b></td><td class="num"><b>${brl(P.totDF)}</b></td><td class="num"><b>${brl(dif)}</b></td><td class="note" style="text-align:left;min-width:300px;white-space:normal;font-weight:400">Total DFC = fluxo líquido do DFC (${brl(P.dfcLiq)}). Transferências entre contas ficam de fora.</td><td></td></tr>`;
  const chk=Math.abs(P.totDF-P.dfcLiq)<0.5;
  const mon=P.per.map(r=>`<tr><td>${mlabel(r.m)}</td><td class="num">${brl(r.ebitda)}</td><td class="num">${brl(r.op)}</td><td class="num">${brl(r.op-r.ebitda)}</td><td class="num">${brl(r.liq)}</td></tr>`).join('');
  return h+covBanner(ms)
  +(skipped?`<p class="note">${skipped} mês(es) do período ficaram fora por não haver DFC (janela: ${mlabel(DFC_MONTHS[0])} a ${mlabel(DFC_MONTHS[DFC_MONTHS.length-1])}).</p>`:'')
  +`<p class="note">Base fixa: DRE por data de caixa (compensação) e DFC por data de pagamento/recebimento; o filtro “Avaliar por” não se aplica. Contas do DFC: as selecionadas na tela DFC (padrão: sem cartões de crédito). Os recebimentos entram em lotes: leia o acumulado, não o mês.</p>`
  +kp
  +`<div class="tw"><table id="tPonte"><tr><th class="l">Linha</th><th>DRE (base caixa)</th><th>DFC (caixa)</th><th>DFC − DRE</th><th class="l">Leitura (hipóteses a validar)</th><th class="l">Fonte</th></tr>${body}</table></div>
  <div class="row">${copyBtn('tPonte')}</div>
  <p class="note">Prova: soma das diferenças por linha = ${brl(sumDif)}; total DFC − total DRE = ${brl(dif)} → ${proof?'confere (diferença R$ 0)':'NÃO CONFERE'}. Total das linhas do DFC × fluxo líquido do DFC: ${chk?'confere':'NÃO CONFERE'}. Linhas do DFC não mapeadas: ${brl(P.L[P.L.length-1].df)}.</p>
  <h3 style="margin:14px 0 6px">Mês a mês · EBITDA × fluxo operacional × fluxo líquido</h3>
  <div class="tw"><table id="tPonteM"><tr><th class="l">Mês</th><th>EBITDA (DRE, caixa)</th><th>Fluxo operacional (DFC)</th><th>Diferença</th><th>Fluxo líquido (DFC)</th></tr>${mon}</table></div>
  <div class="row">${copyBtn('tPonteM')}</div>
  <div class="banner" style="margin-top:10px"><b>Limites.</b> Sem saldo conciliado com extrato, sem inventário e sem competência validada, a ponte explica diferenças entre critérios; não prova causa. Variação de recebíveis e de fornecedores (capital de giro) ainda não é construída porque os títulos em aberto estão desatualizados. Nenhuma linha está validada.</div>`;
}
